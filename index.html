<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/traza_logo_01.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traza</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("traza-theme");
          // Menta claro por defecto (evita flash); oscuro sólo si se eligió.
          if (t !== "dark") document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
